  <h1 id="tracepath"><a href="#tracepath" class="headerlink" title="tracepath"></a>tracepath</h1><p>追踪目的主机经过的路由信息</p>
<h2 id="补充说明"><a href="#补充说明" class="headerlink" title="补充说明"></a>补充说明</h2><p><strong>tracepath命令</strong> 用来追踪并显示报文到达目的主机所经过的路由信息。</p>
<h3 id="语法"><a href="#语法" class="headerlink" title="语法"></a>语法</h3><figure class="highlight shell"><table><tr><td class="gutter"><pre><span class="line">1</span><br></pre></td><td class="code"><pre><code class="hljs shell">tracepath(参数)<br></code></pre></td></tr></table></figure>

<h3 id="参数"><a href="#参数" class="headerlink" title="参数"></a>参数</h3><ul>
<li>目的主机：指定追踪路由信息的目的主机；</li>
<li>端口：指定使用的UDP端口号。</li>
</ul>
<h3 id="实例"><a href="#实例" class="headerlink" title="实例"></a>实例</h3><figure class="highlight shell"><table><tr><td class="gutter"><pre><span class="line">1</span><br><span class="line">2</span><br><span class="line">3</span><br><span class="line">4</span><br><span class="line">5</span><br><span class="line">6</span><br><span class="line">7</span><br><span class="line">8</span><br><span class="line">9</span><br><span class="line">10</span><br><span class="line">11</span><br><span class="line">12</span><br><span class="line">13</span><br><span class="line">14</span><br><span class="line">15</span><br><span class="line">16</span><br></pre></td><td class="code"><pre><code class="hljs shell">tracepath www.58.com<br> 1:  192.168.2.10 (192.168.2.10)                           20.150ms pmtu 1500<br> 1:  unknown (192.168.2.1)                                  9.343ms<br> 2:  221.6.45.33 (221.6.45.33)                             34.430ms<br> 3:  221.6.9.81 (221.6.9.81)                               19.263ms<br> 4:  122.96.66.37 (122.96.66.37)                           54.372ms<br> 5:  219.158.96.149 (219.158.96.149)                      asymm  6 128.526ms<br> 6:  123.126.0.66 (123.126.0.66)                          138.281ms<br> 7:  124.65.57.26 (124.65.57.26)                          166.244ms<br> 8:  61.148.154.98 (61.148.154.98)                        103.723ms<br> 9:  202.106.42.102 (202.106.42.102)                      asymm 10  78.099ms<br>10:  210.77.139.150 (210.77.139.150)                      asymm  9 199.930ms<br>11:  211.151.104.6 (211.151.104.6)                        asymm 10 121.965ms<br>12:  no reply<br>13:  211.151.111.30 (211.151.111.30)                      asymm 12 118.989ms reached<br>     Resume: pmtu 1500 hops 13 back 12<br></code></pre></td></tr></table></figure>
