<article class="page-content">
  <h1 id="apk"><a href="#apk" class="headerlink" title="apk"></a>apk</h1><p>Alpine Linux 下的包管理工具</p>
<h2 id="使用实例"><a href="#使用实例" class="headerlink" title="使用实例"></a>使用实例</h2><figure class="highlight shell"><table><tr><td class="gutter"><pre><span class="line">1</span><br><span class="line">2</span><br><span class="line">3</span><br><span class="line">4</span><br><span class="line">5</span><br><span class="line">6</span><br></pre></td><td class="code"><pre><code class="hljs shell">apk install xxx<br>apk search xxx # 支持正则<br>apk info xxx # 查看包的详细信息<br>apk show # list local package<br><span class="hljs-meta prompt_"># </span><span class="language-bash">卸载并删除 包</span><br>apk del openssh openntp vim<br></code></pre></td></tr></table></figure>

<h3 id="升级"><a href="#升级" class="headerlink" title="升级"></a>升级</h3><p>upgrade命令升级系统已安装的所以软件包（一般包括内核），当然也可指定仅升级部分软件包（通过-u或–upgrade选择指定）。</p>
<figure class="highlight shell"><table><tr><td class="gutter"><pre><span class="line">1</span><br><span class="line">2</span><br><span class="line">3</span><br></pre></td><td class="code"><pre><code class="hljs shell">apk update # 更新最新本地镜像源<br>apk upgrade # 升级软件<br>apk add --upgrade busybox # 指定升级部分软件包<br></code></pre></td></tr></table></figure>

<h3 id="搜索"><a href="#搜索" class="headerlink" title="搜索"></a>搜索</h3><figure class="highlight shell"><table><tr><td class="gutter"><pre><span class="line">1</span><br><span class="line">2</span><br><span class="line">3</span><br><span class="line">4</span><br></pre></td><td class="code"><pre><code class="hljs shell">apk search # 查找所以可用软件包<br>apk search -v # 查找所以可用软件包及其描述内容<br>apk search -v &#x27;acf*&#x27; # 通过软件包名称查找软件包<br>apk search -v -d &#x27;docker&#x27; # 通过描述文件查找特定的软件包<br></code></pre></td></tr></table></figure>

<h3 id="查看包信息"><a href="#查看包信息" class="headerlink" title="查看包信息"></a>查看包信息</h3><p>info命令用于显示软件包的信息。</p>
<figure class="highlight shell"><table><tr><td class="gutter"><pre><span class="line">1</span><br><span class="line">2</span><br><span class="line">3</span><br></pre></td><td class="code"><pre><code class="hljs shell">apk info # 列出所有已安装的软件包<br>apk info -a zlib # 显示完整的软件包信息<br>apk info --who-owns /sbin/lbu # 显示指定文件属于的包<br></code></pre></td></tr></table></figure>

<h2 id="笔记"><a href="#笔记" class="headerlink" title="笔记"></a>笔记</h2><p>还是蛮喜欢 alpine 的，简单纯粹</p>
<figure class="highlight shell"><table><tr><td class="gutter"><pre><span class="line">1</span><br><span class="line">2</span><br><span class="line">3</span><br><span class="line">4</span><br><span class="line">5</span><br><span class="line">6</span><br><span class="line">7</span><br><span class="line">8</span><br><span class="line">9</span><br><span class="line">10</span><br><span class="line">11</span><br><span class="line">12</span><br><span class="line">13</span><br><span class="line">14</span><br><span class="line">15</span><br><span class="line">16</span><br><span class="line">17</span><br><span class="line">18</span><br><span class="line">19</span><br><span class="line">20</span><br><span class="line">21</span><br><span class="line">22</span><br><span class="line">23</span><br><span class="line">24</span><br><span class="line">25</span><br><span class="line">26</span><br><span class="line">27</span><br><span class="line">28</span><br><span class="line">29</span><br><span class="line">30</span><br><span class="line">31</span><br><span class="line">32</span><br><span class="line">33</span><br><span class="line">34</span><br><span class="line">35</span><br><span class="line">36</span><br><span class="line">37</span><br><span class="line">38</span><br><span class="line">39</span><br><span class="line">40</span><br><span class="line">41</span><br><span class="line">42</span><br><span class="line">43</span><br><span class="line">44</span><br><span class="line">45</span><br><span class="line">46</span><br><span class="line">47</span><br><span class="line">48</span><br><span class="line">49</span><br><span class="line">50</span><br><span class="line">51</span><br><span class="line">52</span><br><span class="line">53</span><br><span class="line">54</span><br><span class="line">55</span><br><span class="line">56</span><br><span class="line">57</span><br><span class="line">58</span><br><span class="line">59</span><br><span class="line">60</span><br><span class="line">61</span><br><span class="line">62</span><br><span class="line">63</span><br><span class="line">64</span><br><span class="line">65</span><br><span class="line">66</span><br><span class="line">67</span><br><span class="line">68</span><br><span class="line">69</span><br><span class="line">70</span><br><span class="line">71</span><br><span class="line">72</span><br><span class="line">73</span><br><span class="line">74</span><br><span class="line">75</span><br><span class="line">76</span><br><span class="line">77</span><br><span class="line">78</span><br><span class="line">79</span><br><span class="line">80</span><br></pre></td><td class="code"><pre><code class="hljs shell">apk add iproute2 # ss vs netstat<br>ss -ptl<br>apk add drill # drill vs nslookup&amp;dig<br><br>crond # 开启 cron 服务<br>crontab -l -e<br><br>apk add xxx<br>apk search -v xxx<br>apk info -a xxx<br>apk info<br>echo -e &quot;http://mirrors.aliyun.com/alpine/v3.6/main\nhttp://mirrors.aliyun.com/alpine/v3.6/community&quot; &gt; /etc/apk/repositories<br>apk update<br><span class="hljs-meta prompt_"></span><br><span class="hljs-meta prompt_"># </span><span class="language-bash">storage</span><br>ibu # alpine local backup<br><span class="hljs-meta prompt_"></span><br><span class="hljs-meta prompt_"># </span><span class="language-bash">network</span><br>echo &quot;shortname&quot; &gt; /etc/hostname<br>hostname -F /etc/hostname<br>/etc/hosts<br>/etc/resolv.conf # conig DNS<br>modprobe ipv6 # enable ipv6<br>echo &quot;ipv6&quot; &gt;&gt; /etc/modules<br>iface # config interface<br>apk add iptables ip6tables iptables-doc<br>/etc/init.d/networking restart # activate change<br>apke add iputils # IPv6 traceroute<br>traceroute6 ipv6.google.com<br>awall # alpine wall<br><span class="hljs-meta prompt_"># </span><span class="language-bash">setup a openvpn server</span><br><span class="hljs-meta prompt_"></span><br><span class="hljs-meta prompt_"># </span><span class="language-bash">post-install</span><br>/etc/apk/repositories<br>apk add cherokee --update-cache --repository http://dl-3.alpinelinux.org/alpine/edge/testing/ --allow-untrusted<br>apk search -v --description &#x27;NTP&#x27; # show description and search from description<br>apk info -a zlib<br>apk info -vv|sort<br>apk info -r -R # require / depency<br>apk version -v -l &#x27;&lt;&#x27; # show available updates<br>apk upgrade -U -a<br>apk add -u xxx # update xxx<br><br>/etc/runlevels # runlevel<br>apk add openrc # use openrc for init system<br>rc-update add xxx # set to start on<br>rc-service xxx start # equal -&gt; /etc/init.d/xxx start<br>rc-status<br><br>adduser xxx<br>passwd xxx<br><br>apk add ansible # server<br>ssh-keygen<br>/etc/ansible/hosts<br>apk add python # node<br>ssh-copy-id<br><br>apk add man man-pages mdocml-apropos less less-doc<br>export PAGER=less<br>/etc/rc.conf # /etc/rc.conf -&gt; funny character<br>apk add bash bash-doc bash-completion # bash<br>apk add util-linux pciutils usbutils coreutils binutils findutils grep # grep / awk<br>apk add build-base gcc abuild binutils binutils-doc gcc-doc # compile<br>apk add cmake cmake-doc extra-cmake-modules extra-cmake-modules-doc<br>apk add ccache ccache-doc<br><br>apk add docker # docker<br>rc-update add docker boot<br>rc-service docker start<br>apk add py-pip<br>pip install docker-compose<br>ln -s /usr/bin/docker-compose /usr/bin/doc<br><span class="hljs-meta prompt_"></span><br><span class="hljs-meta prompt_"># </span><span class="language-bash">application</span><br>apk add openssh # ssh<br>rc-update add sshd<br>/etc/init.d/sshd start<br>/etc/sshd_config<br>apk add dropbear # another openssh implementation<br></code></pre></td></tr></table></figure>
