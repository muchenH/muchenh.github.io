<article class="page-content">
  <h1 id="cu"><a href="#cu" class="headerlink" title="cu"></a>cu</h1><p>用于连接另一个系统主机</p>
<h2 id="补充说明"><a href="#补充说明" class="headerlink" title="补充说明"></a>补充说明</h2><p><strong>cu命令</strong> 用于连接另一个系统主机。cu(call up)指令可连接另一台主机，并采用类似拨号终端机的接口工作，也可执行简易的文件传输作业。</p>
<h3 id="语法"><a href="#语法" class="headerlink" title="语法"></a>语法</h3><figure class="highlight shell"><table><tr><td class="gutter"><pre><span class="line">1</span><br><span class="line">2</span><br></pre></td><td class="code"><pre><code class="hljs shell">cu [dehnotv][-a&lt;通信端口&gt;][-c&lt;电话号码&gt;][-E&lt;脱离字符&gt;][-I&lt;设置文件&gt;][-l&lt;外围设备代号&gt;]<br>[-s&lt;连线速率&gt;][-x&lt;排错模式&gt;][-z&lt;系统主机&gt;][--help][-nostop][--parity=none][&lt;系统主机&gt;/&lt;电话号码&gt;]<br></code></pre></td></tr></table></figure>

<h3 id="选项"><a href="#选项" class="headerlink" title="选项"></a>选项</h3><figure class="highlight shell"><table><tr><td class="gutter"><pre><span class="line">1</span><br><span class="line">2</span><br><span class="line">3</span><br><span class="line">4</span><br><span class="line">5</span><br><span class="line">6</span><br><span class="line">7</span><br><span class="line">8</span><br><span class="line">9</span><br><span class="line">10</span><br><span class="line">11</span><br><span class="line">12</span><br><span class="line">13</span><br><span class="line">14</span><br><span class="line">15</span><br><span class="line">16</span><br><span class="line">17</span><br><span class="line">18</span><br></pre></td><td class="code"><pre><code class="hljs shell">-a&lt;通信端口&gt;或-p&lt;通信端口&gt;或--port&lt;通信端口&gt; 使用指定的通信端口进行连线。<br>-c&lt;电话号码&gt;或--phone&lt;电话号码&gt; 拨打该电话号码。<br>-d 进入排错模式。<br>-e或--parity=even 使用双同位检查。<br>-E&lt;脱离字符&gt;或--escape&lt;脱离字符&gt; 设置脱离字符。<br>-h或--halfduple 使用半双工模式。<br>-I&lt;配置文件&gt;或--config&lt;配置文件&gt; 指定要使用的配置文件。<br>-l&lt;外围设备代号&gt;或--line&lt;外围设备代号&gt; 指定某项外围设备，作为连接的设备。<br>-n或--prompt 拨号时等待用户输入电话号码。<br>-o或--parity=odd 使用单同位检查。<br>-s&lt;连线速率&gt;或--speed&lt;连线速率&gt;或--baud&lt;连线速率&gt;或-&lt;连线速率&gt; 设置连线的速率，单位以鲍率计算。<br>-t或--maper 把CR字符置换成LF+CR字符。<br>-v或--version 显示版本信息。<br>-x&lt;排错模式&gt;或--debug&lt;排错模式&gt; 使用排错模式。<br>-z&lt;系统主机&gt;或--system&lt;系统主机&gt; 连接该系统主机。<br>--help 在线帮助。<br>--nostop 关闭Xon/Xoff软件流量控制。<br>--parity=none 不使用同位检查。<br></code></pre></td></tr></table></figure>

<h3 id="实例"><a href="#实例" class="headerlink" title="实例"></a>实例</h3><p>与远程主机连接</p>
<figure class="highlight shell"><table><tr><td class="gutter"><pre><span class="line">1</span><br><span class="line">2</span><br></pre></td><td class="code"><pre><code class="hljs shell">cu -c 0102377765<br>cu -s 38400 9=12015551234<br></code></pre></td></tr></table></figure>
