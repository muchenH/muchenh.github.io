<article class="page-content">
  <h1 id="nmap"><a href="#nmap" class="headerlink" title="nmap"></a>nmap</h1><p>网络探测和安全审核</p>
<h2 id="补充说明"><a href="#补充说明" class="headerlink" title="补充说明"></a>补充说明</h2><p><strong>nmap命令</strong> 是一款开放源代码的网络探测和安全审核工具，它的设计目标是快速地扫描大型网络。</p>
<h3 id="语法"><a href="#语法" class="headerlink" title="语法"></a>语法</h3><figure class="highlight shell"><table><tr><td class="gutter"><pre><span class="line">1</span><br></pre></td><td class="code"><pre><code class="hljs shell">nmap(选项)(参数)<br></code></pre></td></tr></table></figure>

<h3 id="选项"><a href="#选项" class="headerlink" title="选项"></a>选项</h3><figure class="highlight shell"><table><tr><td class="gutter"><pre><span class="line">1</span><br><span class="line">2</span><br><span class="line">3</span><br><span class="line">4</span><br><span class="line">5</span><br><span class="line">6</span><br><span class="line">7</span><br><span class="line">8</span><br><span class="line">9</span><br><span class="line">10</span><br><span class="line">11</span><br><span class="line">12</span><br><span class="line">13</span><br><span class="line">14</span><br><span class="line">15</span><br><span class="line">16</span><br><span class="line">17</span><br><span class="line">18</span><br><span class="line">19</span><br><span class="line">20</span><br><span class="line">21</span><br><span class="line">22</span><br><span class="line">23</span><br><span class="line">24</span><br></pre></td><td class="code"><pre><code class="hljs shell">-O：激活操作探测；<br>-P0：值进行扫描，不ping主机；<br>-PT：是同TCP的ping；<br>-sV：探测服务版本信息；<br>-sP：ping扫描，仅发现目标主机是否存活；<br>-ps：发送同步（SYN）报文；<br>-PU：发送udp ping；<br>-PE：强制执行直接的ICMPping；<br>-PB：默认模式，可以使用ICMPping和TCPping；<br>-6：使用IPv6地址；<br>-v：得到更多选项信息；<br>-d：增加调试信息地输出；<br>-oN：以人们可阅读的格式输出；<br>-oX：以xml格式向指定文件输出信息；<br>-oM：以机器可阅读的格式输出；<br>-A：使用所有高级扫描选项；<br>--resume：继续上次执行完的扫描；<br>-P：指定要扫描的端口，可以是一个单独的端口，用逗号隔开多个端口，使用“-”表示端口范围；<br>-e：在多网络接口Linux系统中，指定扫描使用的网络接口；<br>-g：将指定的端口作为源端口进行扫描；<br>--ttl：指定发送的扫描报文的生存期；<br>--packet-trace：显示扫描过程中收发报文统计；<br>--scanflags：设置在扫描报文中的TCP标志。<br>--send-eth/--send-ip 使用原始以太网发送/构造指定IP发送<br></code></pre></td></tr></table></figure>

<h3 id="参数"><a href="#参数" class="headerlink" title="参数"></a>参数</h3><p>ip地址：指定待扫描报文中的TCP地址。</p>
<h3 id="实例"><a href="#实例" class="headerlink" title="实例"></a>实例</h3><p> <strong>安装nmap</strong> </p>
<figure class="highlight shell"><table><tr><td class="gutter"><pre><span class="line">1</span><br></pre></td><td class="code"><pre><code class="hljs shell">yum install nmap<br></code></pre></td></tr></table></figure>

<p> <strong>使用nmap扫描<a target="_blank" rel="noopener" href="http://www.jsdig.com的开放端口/">www.jsdig.com的开放端口</a></strong> </p>
<figure class="highlight shell"><table><tr><td class="gutter"><pre><span class="line">1</span><br><span class="line">2</span><br><span class="line">3</span><br><span class="line">4</span><br><span class="line">5</span><br><span class="line">6</span><br><span class="line">7</span><br><span class="line">8</span><br><span class="line">9</span><br><span class="line">10</span><br></pre></td><td class="code"><pre><code class="hljs shell">[root@localhost ~]# nmap www.jsdig.com<br><br>Starting Nmap 4.11 ( http://www.insecure.org/nmap/ ) at 2013-12-28 00:06 CST<br>Interesting ports on 100-42-212-8.static.webnx.com (100.42.212.8):<br>Not shown: 1678 filtered ports<br>PORT   STATE service<br>22/tcp open  ssh<br>80/tcp open  http<br><br>Nmap finished: 1 IP address (1 host up) scanned in 45.870 seconds<br></code></pre></td></tr></table></figure>
