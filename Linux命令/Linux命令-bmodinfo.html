  <h1 id="bmodinfo"><a href="#bmodinfo" class="headerlink" title="bmodinfo"></a>bmodinfo</h1><p>显示给定模块的详细信息</p>
<h2 id="补充说明"><a href="#补充说明" class="headerlink" title="补充说明"></a>补充说明</h2><p><strong>bmodinfo命令</strong> 用于显示给定模块的详细信息。</p>
<h3 id="语法"><a href="#语法" class="headerlink" title="语法"></a>语法</h3><figure class="highlight shell"><table><tr><td class="gutter"><pre><span class="line">1</span><br></pre></td><td class="code"><pre><code class="hljs shell">bmodinfo(选项)(参数)<br></code></pre></td></tr></table></figure>

<h3 id="选项"><a href="#选项" class="headerlink" title="选项"></a>选项</h3><figure class="highlight shell"><table><tr><td class="gutter"><pre><span class="line">1</span><br><span class="line">2</span><br><span class="line">3</span><br><span class="line">4</span><br><span class="line">5</span><br><span class="line">6</span><br></pre></td><td class="code"><pre><code class="hljs shell">-a：显示模块作者；<br>-d：显示模块的描述信息；<br>-l：显示模块的许可信息；<br>-p：显示模块的参数信息；<br>-n：显示模块对应的文字信息；<br>-0：用ASCII码的0字符分割字段值，而不使用新行。<br></code></pre></td></tr></table></figure>

<h3 id="参数"><a href="#参数" class="headerlink" title="参数"></a>参数</h3><p>模块名：要显示详细信息的模块名称。</p>
<h3 id="实例"><a href="#实例" class="headerlink" title="实例"></a>实例</h3><p>显示sg模块的信息：</p>
<figure class="highlight shell"><table><tr><td class="gutter"><pre><span class="line">1</span><br><span class="line">2</span><br><span class="line">3</span><br><span class="line">4</span><br><span class="line">5</span><br><span class="line">6</span><br><span class="line">7</span><br><span class="line">8</span><br><span class="line">9</span><br><span class="line">10</span><br><span class="line">11</span><br></pre></td><td class="code"><pre><code class="hljs shell">[root@localhost ~]# modinfo sg<br>filename:    /lib/modules/2.6.9-42.ELsmp/kernel/drivers/scsi/sg.ko<br>author:     Douglas Gilbert<br>description:  SCSI generic (sg) driver<br>license:    GPL<br>version:    3.5.31 B0B0CB1BB59F0669A1F0D6B<br>parm:      def_reserved_size:size of buffer reserved for each fd<br>parm:      allow_dio:allow direct I/O (default: 0 (disallow))<br>alias:     char-major-21-*<br>vermagic:    2.6.9-42.ELsmp SMP 686 REGPARM 4KSTACKS gcc-3.4<br>depends:    scsi_mod<br></code></pre></td></tr></table></figure>
