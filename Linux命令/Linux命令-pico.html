  <h1 id="pico"><a href="#pico" class="headerlink" title="pico"></a>pico</h1><p>功能强大全屏幕的文本编辑器</p>
<h2 id="补充说明"><a href="#补充说明" class="headerlink" title="补充说明"></a>补充说明</h2><p><strong>pico命令</strong> 是功能强大全屏幕的文本编辑器。pico的操作简单，提供了丰富的快捷键。常用的快捷键如下：</p>
<figure class="highlight shell"><table><tr><td class="gutter"><pre><span class="line">1</span><br><span class="line">2</span><br><span class="line">3</span><br><span class="line">4</span><br><span class="line">5</span><br><span class="line">6</span><br><span class="line">7</span><br><span class="line">8</span><br><span class="line">9</span><br><span class="line">10</span><br><span class="line">11</span><br><span class="line">12</span><br></pre></td><td class="code"><pre><code class="hljs shell">Ctrl+G：获得pico的帮助信息；<br>Ctrl+O：保存文件内容，如果是新文件，需要输入文件名；<br>Ctrl+R：在当前光标位置插入一个指定的文本文件内容；<br>Ctrl+Y：向前翻页；<br>Ctrl+V：向后翻页；<br>Ctrl+w：对文件进行搜索；<br>Ctrl+K：剪切当前文件行到粘贴缓冲区；<br>Ctrl+U：粘贴缓冲区中的内容到当前光标所在位置；<br>Ctrl+C：显示当前光标位置；<br>Ctrl+T：调用拼写检查功能，对文档进行拼写检查；<br>Ctrl+J：段落重排；<br>Ctrl+X：退出，当文件内容发生改变时，提供是否保存修改。<br></code></pre></td></tr></table></figure>

<h3 id="语法"><a href="#语法" class="headerlink" title="语法"></a>语法</h3><figure class="highlight shell"><table><tr><td class="gutter"><pre><span class="line">1</span><br></pre></td><td class="code"><pre><code class="hljs shell">pico(选项)(参数)<br></code></pre></td></tr></table></figure>

<h3 id="选项"><a href="#选项" class="headerlink" title="选项"></a>选项</h3><figure class="highlight shell"><table><tr><td class="gutter"><pre><span class="line">1</span><br><span class="line">2</span><br><span class="line">3</span><br><span class="line">4</span><br><span class="line">5</span><br><span class="line">6</span><br><span class="line">7</span><br><span class="line">8</span><br><span class="line">9</span><br><span class="line">10</span><br><span class="line">11</span><br><span class="line">12</span><br><span class="line">13</span><br><span class="line">14</span><br><span class="line">15</span><br><span class="line">16</span><br><span class="line">17</span><br><span class="line">18</span><br><span class="line">19</span><br><span class="line">20</span><br></pre></td><td class="code"><pre><code class="hljs shell">-b：开启置换的功能；<br>-d：开启删除的功能；<br>-e：使用完整的文件名称；<br>-f：支持键盘上F1、F2...功能键；<br>-g：显示光标；<br>-h：在线帮助；<br>-j：开启切换的功能；<br>-k：预设pico在使用剪下命令时，会把光标所在的列的内容全部删除；<br>-m：开启鼠标支持的功能，您可用鼠标点选命令列表；<br>-n&lt;间隔秒数&gt;：设置多久检查一次新邮件；<br>-o&lt;工作目录&gt;：设置工作目录；<br>-q：忽略预设值；<br>-r&lt;编辑页宽&gt;：设置编辑文件的页宽；<br>-s&lt;拼字检查器&gt;：另外指定拼字检查器；<br>-t：启动工具模式；<br>-v：启动阅读模式，用户只能观看，无法编辑文件的内容；<br>-w：关闭自动换行，通过这个参数可以编辑内容很长的列；<br>-x：关闭页面下方的命令列表；<br>-z：让pico可被Ctrl+z中断，暂存在后台作业里；<br>+&lt;列表编号&gt;：执行pico指令进入编辑模式时，从指定的列数开始编辑。<br></code></pre></td></tr></table></figure>

<h3 id="参数"><a href="#参数" class="headerlink" title="参数"></a>参数</h3><p>文件：指定要编辑的文件。</p>
