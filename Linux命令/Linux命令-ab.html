<article class="page-content">
  <h1 id="ab"><a href="#ab" class="headerlink" title="ab"></a>ab</h1><p>Apache服务器的性能测试工具</p>
<h2 id="安装"><a href="#安装" class="headerlink" title="安装"></a>安装</h2><p>若系统未安装，使用以下命令安装</p>
<figure class="highlight shell"><table><tr><td class="gutter"><pre><span class="line">1</span><br><span class="line">2</span><br><span class="line">3</span><br><span class="line">4</span><br><span class="line">5</span><br><span class="line">6</span><br></pre></td><td class="code"><pre><code class="hljs shell"><span class="hljs-meta prompt_"># </span><span class="language-bash">Ubuntu</span><br>sudo apt-get install apache2-utils<br><span class="hljs-meta prompt_"></span><br><span class="hljs-meta prompt_"># </span><span class="language-bash">Centos</span><br>yum install httpd-tools<br><br></code></pre></td></tr></table></figure>


<h2 id="补充说明"><a href="#补充说明" class="headerlink" title="补充说明"></a>补充说明</h2><p><strong>ab命令</strong> 是一个测试你 Apache http 服务器的工具，你可以通过这个工具，指定一个单位时间内向 apache 发出的请求数量来看看你的 Apache 和机器配合的性能如何。</p>
<h3 id="语法"><a href="#语法" class="headerlink" title="语法"></a>语法</h3><figure class="highlight shell"><table><tr><td class="gutter"><pre><span class="line">1</span><br><span class="line">2</span><br><span class="line">3</span><br><span class="line">4</span><br><span class="line">5</span><br><span class="line">6</span><br><span class="line">7</span><br></pre></td><td class="code"><pre><code class="hljs shell">ab [ -A auth-username:password ] [ -c concurrency ] [ -C cookie-name=value<br>] [ -d ] [ -e csv-file ] [ -g gnuplot-file ] [ -h ] [ -H custom-header ] [<br>-i  ]  [  -k  ]  [  -n  requests  ] [ -p POST-file ] [ -P proxy-auth-user‐<br>name:password ] [ -q ] [ -s ] [ -S ] [ -t timelimit ] [ -T content-type  ]<br>[  -v verbosity] [ -V ] [ -w ] [ -x &lt;table&gt;-attributes ] [ -X proxy[:port]<br>]  [  -y  &lt;tr&gt;-attributes  ]  [  -z   &lt;td&gt;-attributes   ]   [http://]host‐<br>name[:port]/path<br></code></pre></td></tr></table></figure>

<h3 id="选项"><a href="#选项" class="headerlink" title="选项"></a>选项</h3><figure class="highlight shell"><table><tr><td class="gutter"><pre><span class="line">1</span><br><span class="line">2</span><br><span class="line">3</span><br><span class="line">4</span><br><span class="line">5</span><br><span class="line">6</span><br><span class="line">7</span><br><span class="line">8</span><br><span class="line">9</span><br><span class="line">10</span><br><span class="line">11</span><br><span class="line">12</span><br><span class="line">13</span><br><span class="line">14</span><br><span class="line">15</span><br><span class="line">16</span><br><span class="line">17</span><br><span class="line">18</span><br><span class="line">19</span><br><span class="line">20</span><br><span class="line">21</span><br><span class="line">22</span><br><span class="line">23</span><br><span class="line">24</span><br><span class="line">25</span><br><span class="line">26</span><br><span class="line">27</span><br><span class="line">28</span><br><span class="line">29</span><br><span class="line">30</span><br><span class="line">31</span><br><span class="line">32</span><br><span class="line">33</span><br><span class="line">34</span><br><span class="line">35</span><br><span class="line">36</span><br><span class="line">37</span><br><span class="line">38</span><br><span class="line">39</span><br><span class="line">40</span><br><span class="line">41</span><br><span class="line">42</span><br><span class="line">43</span><br><span class="line">44</span><br><span class="line">45</span><br><span class="line">46</span><br><span class="line">47</span><br><span class="line">48</span><br><span class="line">49</span><br><span class="line">50</span><br><span class="line">51</span><br><span class="line">52</span><br><span class="line">53</span><br><span class="line">54</span><br><span class="line">55</span><br><span class="line">56</span><br><span class="line">57</span><br><span class="line">58</span><br><span class="line">59</span><br><span class="line">60</span><br><span class="line">61</span><br><span class="line">62</span><br><span class="line">63</span><br><span class="line">64</span><br><span class="line">65</span><br><span class="line">66</span><br><span class="line">67</span><br><span class="line">68</span><br><span class="line">69</span><br><span class="line">70</span><br><span class="line">71</span><br><span class="line">72</span><br><span class="line">73</span><br><span class="line">74</span><br><span class="line">75</span><br><span class="line">76</span><br><span class="line">77</span><br><span class="line">78</span><br><span class="line">79</span><br><span class="line">80</span><br><span class="line">81</span><br><span class="line">82</span><br><span class="line">83</span><br><span class="line">84</span><br><span class="line">85</span><br><span class="line">86</span><br><span class="line">87</span><br><span class="line">88</span><br><span class="line">89</span><br><span class="line">90</span><br></pre></td><td class="code"><pre><code class="hljs shell">-A auth-username:password<br>      #  支持基本的验证证书,用户名和密码之间使用&quot;冒号&quot;                    :<br>      # 分隔开,ab将以明文方式传送过去.不管服务器是不是需要<br>      # ,也就是说你的服务器需要支持401认证.<br><br>-c concurrency<br>      # 同时向服务器端发送的请求数目，默认状态下是一次 只执行一个http请求.<br><br>-C cookie-name=value<br>      # Add a Cookie: line to the request. The argument is typically in the<br>      # form of a name=value pair. This field is repeatable.<br><br>-d    #  Do not display  the  &quot;percentage  served  within  XX  [ms]  table&quot;.<br>      # (legacy support).<br><br>-e csv-file<br>      # Write  a  Comma  separated value (CSV) file which contains for each<br>      # percentage (from 1% to 100%) the time (in milli seconds) it took to<br>      # serve  that percentage of the requests. This is usually more useful<br>      # than the &#x27;gnuplot&#x27; file; as the results are already &#x27;binned&#x27;.<br><br>-g gnuplot-file<br>      # Write all measured values out as a &#x27;gnuplot&#x27; or TSV  (Tab  separate<br>      # values)  file.  This file can easily be imported into packages like<br>      # Gnuplot, IDL, Mathematica, Igor or even Excell. The labels  are  on<br>      # the first line of the file.<br>-h    # 显示使用说明<br>-H custom-header<br>      # 向请求包追加附加的标题字串.此参数应该是有效的标题         行(header<br>      # line)形式,通常使用冒号&quot;:&quot;来分隔有效配对 (valid  pair)例如  &#x27;Accept-<br>      # Encoding: zip/zop;8 bit&#x27;;<br><br>-i    # 使用一个 http 头(HEAD) 来替换 GET方法.不可以掺入POST 方法<br><br>-k    #  允许http      KeepAlive      ；也就是说执行多个请求在一个      http<br>      # 会话当中，默认是不允许的也就是no KeepAlive啦;)<br><br>-n requests<br>      # 执行一次测试会话的时候所发出的请求数目,默认是执行一个单一的请求<br>      # 当然了这样的测试结果也就没什么意义了<br><br>-p POST-file<br>      # 测试程序也就是ab,将向Apache server发送带有HTTP POST 的请求.<br><br>-P proxy-auth-username:password<br>      # 当需要通过代理测试一台 HTTP 服务器的时候而你的代理<br>      # 又需要用户名密码验证,这时你可以使用这个选项,同样<br>      # 用户名与密码之间使用冒号&quot;:&quot;分隔开,ab将之以明文的方式<br>      # 发送出去,当然,前提是你的代理是处于407认证状态的<br><br>-q    #  When processing more than 150 requests, ab outputs a progress count<br>      # on  stderr  every  10% or 100 requests or so. The -q flag will sup‐<br>      # press these messages.<br><br>-s    #  When compiled in (ab -h will show you) use the SSL protected  https<br>      # rather  than  the  http  protocol. This feature is experimental and<br>      # very rudimentary. You probably do not want to use it.<br><br>-S    #  Do not display the median and standard deviation values,  nor  dis‐<br>      # play  the  warning/error  messages  when the average and median are<br>      # more than one or two times the standard deviation  apart.  And  de‐<br>      # fault to the min/avg/max values. (legacy support).<br><br>-t timelimit<br>      #  设置测试的时间的长短，使用这个选项ab将自动设置<br>      # 测试请求会话数目为50000，然后以你设置的时间为<br>      # 固定周期.默认状态下是没有时限的，也就是直到完成<br>      # 你所设置的请求数目为止.<br><br>-T content-type<br>      # 内容类型标头,使用在POST数据的时候.<br><br>-v verbosity<br>      # 设置冗余级别,4级打印出每个请求标头的详细信息,<br>      # 3级打印出回应代码(例如,404,200),2级打印出警告 信息和指示消息<br><br>-V    # 显示版本号并且退出<br>-w    # 打印输出结果到HTML表中. 默认的表是两列n行白底黑框<br><br>-x &lt;table&gt;-attributes<br>      # 使用字串来描述表的属性,该属性字串应该插入到&lt;table 这里 &gt;<br><br>-X proxy[:port]<br>      # Use a proxy server for the requests.<br><br>-y &lt;tr&gt;-attributes<br>      # 用于生成html表格每行的属性名 (&lt;tr&gt;)<br><br>-z &lt;td&gt;-attributes<br>      # 用于生成html表格每列的属性名 (&lt;td&gt;)<br></code></pre></td></tr></table></figure>

<h3 id="参数"><a href="#参数" class="headerlink" title="参数"></a>参数</h3><p>主机：被测试主机。</p>
<h3 id="实例"><a href="#实例" class="headerlink" title="实例"></a>实例</h3><figure class="highlight shell"><table><tr><td class="gutter"><pre><span class="line">1</span><br><span class="line">2</span><br></pre></td><td class="code"><pre><code class="hljs shell"><span class="hljs-meta prompt_"># </span><span class="language-bash">10个并发， 请求500次</span><br>ab -c 10 -n 500 https://www.qq.com/<br></code></pre></td></tr></table></figure>
