<article class="page-content">
  <h1 id="dmesg"><a href="#dmesg" class="headerlink" title="dmesg"></a>dmesg</h1><p>显示Linux系统启动信息</p>
<h2 id="补充说明"><a href="#补充说明" class="headerlink" title="补充说明"></a>补充说明</h2><p><strong>dmesg命令</strong> 被用于检查和控制内核的环形缓冲区。kernel会将开机信息存储在ring buffer中。您若是开机时来不及查看信息，可利用dmesg来查看。开机信息保存在<code>/var/log/dmesg</code>文件里。</p>
<h3 id="语法"><a href="#语法" class="headerlink" title="语法"></a>语法</h3><figure class="highlight shell"><table><tr><td class="gutter"><pre><span class="line">1</span><br></pre></td><td class="code"><pre><code class="hljs shell">dmesg(选项)<br></code></pre></td></tr></table></figure>

<h3 id="选项"><a href="#选项" class="headerlink" title="选项"></a>选项</h3><figure class="highlight shell"><table><tr><td class="gutter"><pre><span class="line">1</span><br><span class="line">2</span><br><span class="line">3</span><br></pre></td><td class="code"><pre><code class="hljs shell">-c：显示信息后，清除ring buffer中的内容；<br>-s&lt;缓冲区大小&gt;：预设置为8196，刚好等于ring buffer的大小；<br>-n：设置记录信息的层级。<br></code></pre></td></tr></table></figure>

<h3 id="实例"><a href="#实例" class="headerlink" title="实例"></a>实例</h3><figure class="highlight shell"><table><tr><td class="gutter"><pre><span class="line">1</span><br><span class="line">2</span><br><span class="line">3</span><br><span class="line">4</span><br><span class="line">5</span><br><span class="line">6</span><br><span class="line">7</span><br><span class="line">8</span><br><span class="line">9</span><br><span class="line">10</span><br><span class="line">11</span><br></pre></td><td class="code"><pre><code class="hljs shell">[root@localhost ~]# dmesg | head<br>Linux version 2.6.18-348.6.1.el5 (mockbuild@builder17.centos.org) (gcc version 4.1.2 20080704 (Red Hat 4.1.2-54)) #1 SMP Tue May 21 15:34:22 EDT 2013<br>BIOS-provided physical RAM map:<br> BIOS-e820: 0000000000010000 - 000000000009f400 (usable)<br> BIOS-e820: 000000000009f400 - 00000000000a0000 (reserved)<br> BIOS-e820: 00000000000f0000 - 0000000000100000 (reserved)<br> BIOS-e820: 0000000000100000 - 000000007f590000 (usable)<br> BIOS-e820: 000000007f590000 - 000000007f5e3000 (ACPI NVS)<br> BIOS-e820: 000000007f5e3000 - 000000007f5f0000 (ACPI data)<br> BIOS-e820: 000000007f5f0000 - 000000007f600000 (reserved)<br> BIOS-e820: 00000000e0000000 - 00000000e8000000 (reserved)<br></code></pre></td></tr></table></figure>

<p>查看硬盘基础信息</p>
<figure class="highlight shell"><table><tr><td class="gutter"><pre><span class="line">1</span><br><span class="line">2</span><br><span class="line">3</span><br><span class="line">4</span><br><span class="line">5</span><br><span class="line">6</span><br><span class="line">7</span><br><span class="line">8</span><br></pre></td><td class="code"><pre><code class="hljs shell">dmesg | grep sda<br><br>[    2.442555] sd 0:0:0:0: [sda] 488281250 512-byte logical blocks: (250 GB/232 GiB)<br>[    2.442590] sd 0:0:0:0: [sda] Write Protect is off<br>[    2.442592] sd 0:0:0:0: [sda] Mode Sense: 00 3a 00 00<br>[    2.442607] sd 0:0:0:0: [sda] Write cache: enabled, read cache: enabled, doesn&#x27;t support DPO or FUA<br>[    2.447533]  sda: sda1<br>[    2.448503] sd 0:0:0:0: [sda] Attached SCSI disk<br></code></pre></td></tr></table></figure>

<p>查看多关键字</p>
<figure class="highlight shell"><table><tr><td class="gutter"><pre><span class="line">1</span><br><span class="line">2</span><br><span class="line">3</span><br><span class="line">4</span><br><span class="line">5</span><br></pre></td><td class="code"><pre><code class="hljs shell">dmesg | grep -E &quot;vcc5v0_host|vcc_3v3_s0|ttyS&quot;<br><br>[    1.193143] vcc5v0_host: supplied by vcc5v0_usb<br>[    1.481139] feb80000.serial: ttyS5 at MMIO 0xfeb80000 (irq = 73, base_baud = 1500000) is a 16550A<br>[    1.513541] vcc_3v3_s0: supplied by vcc5v0_sys<br></code></pre></td></tr></table></figure>
